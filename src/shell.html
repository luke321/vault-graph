<title>Vault Graph</title>

<style>
/* THE STANDALONE'S OWN CHROME, and the only CSS here that is not page.css.
 *
 * page.css is scoped entirely under `.vault-graph` so it can be dropped into somebody
 * else's document without styling it. That leaves the document itself unstyled -- and the
 * container asks for `height: 100%`, which against an auto-height body resolves to zero and
 * draws nothing at all. In a plugin the host has already sized the view; here nobody has,
 * so the shell does it.
 *
 * No custom properties are used: they live on `.vault-graph` now, so they do not exist out
 * here. The container paints the full viewport anyway, so nothing shows through.
 */
html, body { height: 100%; margin: 0; }
</style>
<style>
<!--CSS-->
</style>

<!--LIBS-->
<!--DATA-->

<!--SCRIPT-->
</script>

<script>
// github#58
var SETTINGS_KEY = "vault-graph:settings:" +
  ((window.VAULT_DATA && window.VAULT_DATA.vault) || "default");

function loadSettings() {
  try {
    var raw = window.localStorage.getItem(SETTINGS_KEY);
    var v = raw ? JSON.parse(raw) : null;
    return v && typeof v === "object" ? v : {};
  } catch (e) { return {}; }
}

function saveSettings(patch) {
  try {
    var next = loadSettings();
    for (var k in patch) {
      if (Object.prototype.hasOwnProperty.call(patch, k)) next[k] = patch[k];
    }
    window.localStorage.setItem(SETTINGS_KEY, JSON.stringify(next));
  } catch (e) { }
}

mountVaultGraph(
  document.getElementById("vg-app"),
  window.VAULT_DATA,
  {
    Graph: window.VaultGraphEngine.GraphStore,
    Renderer: window.VaultGraphEngine.Renderer,
    logoMask: window.VAULT_LOGO_MASK || "",
    settingsUI: true,
    folderColors: loadSettings().folderColors,
    onFolderColors: function (map) { saveSettings({ folderColors: map }); },
    subfolderColors: loadSettings().subfolderColors,
    onSubfolderColors: function (map) { saveSettings({ subfolderColors: map }); },
    folderShown: loadSettings().folderShown,
    onFolderShown: function (map) { saveSettings({ folderShown: map }); },
    panEnabled: loadSettings().panEnabled,
    onPanEnabled: function (v) { saveSettings({ panEnabled: v }); },
    // github#23
    compactAxis: loadSettings().compactAxis,
    onCompactAxis: function (v) { saveSettings({ compactAxis: v }); },
    // github#3
    unlinkedByFolder: loadSettings().unlinkedByFolder,
    onUnlinkedByFolder: function (v) { saveSettings({ unlinkedByFolder: v }); },
    // github#3
    unlinkedTintByFolder: loadSettings().unlinkedTintByFolder,
    onUnlinkedTintByFolder: function (v) { saveSettings({ unlinkedTintByFolder: v }); },
    pinned: loadSettings().pinned,
    onPinned: function (ids) { saveSettings({ pinned: ids }); }
  }
);
</script>
</body>
</html>
