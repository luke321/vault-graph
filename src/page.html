<div id="vg-app" class="vault-graph" data-theme="dark">
  <aside id="vg-sidebar">
    <div class="brand">
      <h1 id="vg-vname">Vault Graph</h1>
    </div>

    <div class="block">
    </div>

    <div class="block">
      <div class="lbl">Search</div>
      <input type="search" id="vg-q" placeholder="Find a note...">
      <div id="vg-hits"></div>
    </div>

    <div class="block">
      <div class="row"><div class="lbl" style="margin:0">Timeline</div><span class="val" id="vg-tlv">All</span></div>
      <input type="range" id="vg-tl" min="0" max="100" value="100"
             title="Reveal notes oldest-first. The slider is linear in NOTE COUNT, not in time: nearly every note is from the last few months, so a time axis would spend most of its travel on empty years.">
      <div class="mini" style="margin-top:7px">
        <button id="vg-tlplay" title="Grow the vault from its first note to now">Play</button>
        <button id="vg-tlall">All</button>
        <button id="vg-today" aria-pressed="false" title="Colour, push out and halo every note created or edited today">Mark today</button>
      </div>
    </div>

    <div class="block">
      <div class="row" style="margin-bottom:7px">
        <div class="lbl" style="margin:0">Groups <span id="vg-gcount" class="val"></span></div>
        <div class="mini"><button id="vg-allon">All</button><button id="vg-alloff">None</button></div>
      </div>
      <div id="vg-legend"></div>
    </div>

    <div class="block">
      <div class="lbl">View</div>
      <div class="tools">
        <button id="vg-refresh" title="Re-read the file from disk and reset all filters. Re-reads this file from disk and clears every filter. To pick up notes written since it was built, run refresh-graph.ps1 (or build-graph.mjs) first.">Refresh</button>
        <button id="vg-fit">Fit</button>
        <button id="vg-png">Save PNG</button>
      </div>
    </div>

    <div id="vg-stats"></div>
  </aside>

  <main id="vg-stage">
    <!-- Notes added per day, above the disc. Its own grid row, so the disc is
         centred in what is left rather than being overlapped. -->
    <div id="vg-heat">
      <div class="hrow">
        <div class="lbl">Notes added</div>
        <span id="vg-heatnote"></span>
        <!-- THREE CONCEPTS, one filter. The switcher is scaffolding for the review and
             would not survive a decision: whichever control wins, the other two go and
             this row goes with them. -->
        <div id="vg-dsw" class="dsw" role="group" aria-label="Date range control">
          <button data-dui="rail" aria-pressed="true"
                  title="A year rail beside the band. Click a year to move the window; drag across the weeks to set the range.">Rail</button>
          <button data-dui="ribbon" aria-pressed="false"
                  title="One strip under the band carrying every month of the vault. Drag to brush a range; the band follows.">Ribbon</button>
          <button data-dui="sliders" aria-pressed="false"
                  title="Two sliders under the band, even in notes rather than in time.">Sliders</button>
        </div>
        <div id="vg-heatscale" aria-hidden="true">
          <span>fewer</span><canvas id="vg-heatkey"></canvas><span>more</span>
        </div>
      </div>
      <!-- The band and whatever sits beside it. A row, so a concept can use the space to
           the left of the grid that the centred canvas has always been leaving empty. -->
      <div class="hmid">
        <canvas id="vg-rail" hidden></canvas>
        <div id="vg-heatwrap"><canvas id="vg-heatc"></canvas></div>
      </div>
      <!-- ...and whatever sits below it. -->
      <div class="hfoot">
        <canvas id="vg-ribbon" hidden></canvas>
        <div id="vg-twin" hidden>
          <input type="range" id="vg-rfrom" min="0" max="1000" value="0"
                 title="Earliest note to include. Even in NOTES, not in days, so the travel is not spent on empty years.">
          <input type="range" id="vg-rto" min="0" max="1000" value="1000"
                 title="Latest note to include.">
        </div>
        <div class="hfootrow">
          <span id="vg-rangenote"></span>
          <button id="vg-rangeall" class="btn" title="Clear the date range">All dates</button>
        </div>
      </div>
      <div id="vg-htip" hidden></div>
    </div>

    <div id="vg-canvas">
      <!-- Before #graph on purpose: the canvases then paint OVER the logo, so if an
           unlinked note is ever sunflower-packed into the hub hole it draws on top of
           the logo rather than being hidden behind it. (This vault currently has 0
           unlinked notes, so the hole is empty -- but that is data, not a guarantee.) -->
      <div id="vg-logo" aria-hidden="true" hidden></div>
      <!-- Two-ring mode only: the inner band's palette, masked to the middle of the mark
           so it fades out into the outer band's colours. Same logo mask, intersected
           with a radial fade. -->
      <div id="vg-logoInner" aria-hidden="true" hidden></div>
      <div id="vg-graph"></div>
      <div id="vg-tip" hidden></div>
      <div id="vg-detail" hidden></div>
    </div>

    <div id="vg-busy">Laying out graph...</div>
  </main>
</div>
