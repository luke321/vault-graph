# main only ever receives develop.
#
# WHY A WORKFLOW AND NOT A BRANCH PROTECTION SETTING: GitHub can require a pull request,
# require a review, require a status check and forbid a force push -- but it has no rule
# for "the pull request must come FROM this branch". So the rule is a check, and the
# ruleset on main requires this check to pass. Together they mean a pull request from any
# other branch cannot be merged, and there is no direct push to main to sidestep it.
#
# The point is not ceremony. It is that main is what the Obsidian directory installs from
# and what `Closes #n` resolves against, so anything reaching it should already have gone
# through develop -- where the invariant suite runs on every push.
#
# The mirror of this for the command line is in .githooks/pre-push, which refuses a push to
# main that develop is not already an ancestor of. Neither is a substitute for the other:
# this one governs the button on the website, that one governs `git push`.

name: branch policy

on:
  pull_request:
    branches: [main]
    # Re-run when the PR is retargeted or its head moves, so an edited PR cannot keep a
    # green check it earned under a different base.
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  source-branch:
    name: main only accepts develop
    runs-on: ubuntu-latest
    steps:
      - name: The head branch must be develop
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          # A fork's branch can also be called develop, so the repository is checked too --
          # otherwise the rule is satisfied by anyone who names a branch correctly.
          if [ "$HEAD_REF" = "develop" ] && [ "$HEAD_REPO" = "$BASE_REPO" ]; then
            echo "head is $HEAD_REPO:$HEAD_REF -- allowed"
            exit 0
          fi
          echo "::error::main only accepts pull requests from develop in this repository."
          echo "This pull request is from $HEAD_REPO:$HEAD_REF."
          echo ""
          echo "Merge your branch into develop first, then open develop -> main."
          echo "develop is where the invariant suite runs on every push; main is what the"
          echo "plugin directory installs from."
          exit 1
